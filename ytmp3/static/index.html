<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ytmp3</title>
<style>
  :root {
    --bg: #f6f5f2; --panel: #ffffff; --ink: #1c1b19; --muted: #6b6862; --line: #e3e0da;
    --accent: #d2381f; --accent-ink: #ffffff; --ok: #2f7d4f; --err: #b3261e; --track: #ece9e3;
    --wave: #cfcac1; --sel: rgba(210, 56, 31, .10);
    --radius: 12px;
    color-scheme: light;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #151413; --panel: #1f1e1c; --ink: #f1efea; --muted: #a29e96; --line: #33312d;
      --accent: #ff5a3c; --accent-ink: #1a0f0c; --ok: #6cc28f; --err: #ff8a80; --track: #2c2a27;
      --wave: #4d4943; --sel: rgba(255, 90, 60, .14);
      color-scheme: dark;
    }
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; background: var(--bg); color: var(--ink);
    font: 15px/1.5 -apple-system, BlinkMacSystemFont, "Apple SD Gothic Neo", "Pretendard", sans-serif;
  }
  main { max-width: 720px; margin: 0 auto; padding: 48px 16px 80px; }
  h1 { font-size: 28px; letter-spacing: -0.02em; margin: 0; }
  h1 span { color: var(--accent); }
  .sub { color: var(--muted); margin: 4px 0 28px; }

  form { display: flex; gap: 8px; }
  #url {
    flex: 1; min-width: 0; font: inherit; font-size: 16px; padding: 14px 16px;
    border: 1px solid var(--line); border-radius: var(--radius); background: var(--panel); color: var(--ink);
  }
  #url:focus { outline: 2px solid var(--accent); outline-offset: -1px; border-color: transparent; }
  button {
    font: inherit; cursor: pointer; border-radius: var(--radius); border: 1px solid var(--line);
    background: var(--panel); color: var(--ink); padding: 8px 14px;
  }
  button:hover { border-color: var(--muted); }
  button.primary {
    background: var(--accent); color: var(--accent-ink); border-color: var(--accent);
    font-weight: 600; padding: 14px 20px; white-space: nowrap;
  }
  button.primary:disabled { opacity: .5; cursor: default; }
  .formerr { color: var(--err); min-height: 1.5em; margin: 6px 2px 0; font-size: 14px; }

  .folder { display: flex; align-items: center; gap: 8px; color: var(--muted); font-size: 14px; margin: 4px 2px 32px; flex-wrap: wrap; }
  .folder code { color: var(--ink); background: var(--track); padding: 2px 8px; border-radius: 6px; word-break: break-all; }
  .folder input { font: inherit; flex: 1; min-width: 200px; padding: 6px 10px; border-radius: 8px; border: 1px solid var(--line); background: var(--panel); color: var(--ink); }
  .linkbtn { border: 0; background: none; color: var(--accent); padding: 2px 4px; }

  #jobs { display: grid; gap: 12px; }
  .empty { color: var(--muted); text-align: center; padding: 40px 0; border: 1px dashed var(--line); border-radius: var(--radius); }
  .job { background: var(--panel); border: 1px solid var(--line); border-radius: var(--radius); padding: 16px; }
  .job .title { font-weight: 600; overflow-wrap: anywhere; }
  .job .meta { color: var(--muted); font-size: 13px; margin-top: 2px; overflow-wrap: anywhere; }
  .bar { height: 6px; background: var(--track); border-radius: 3px; overflow: hidden; margin: 12px 0 6px; }
  .bar i { display: block; height: 100%; width: 0; background: var(--accent); transition: width .3s; }
  .bar.indeterminate i { width: 30%; animation: slide 1.1s ease-in-out infinite; }
  @keyframes slide { from { transform: translateX(-100%); } to { transform: translateX(340%); } }
  .status { font-size: 13px; color: var(--muted); }
  .status.ok { color: var(--ok); }
  .status.err { color: var(--err); }
  audio { width: 100%; margin-top: 12px; }
  .actions { display: flex; gap: 8px; margin-top: 10px; flex-wrap: wrap; }
  .actions button, .actions .btn { font-size: 13px; padding: 6px 12px; }
  .btn {
    display: inline-block; text-decoration: none; border-radius: var(--radius); border: 1px solid var(--accent);
    background: var(--accent); color: var(--accent-ink); font-weight: 600;
  }

  h2 { font-size: 17px; margin: 40px 0 12px; display: flex; flex-wrap: wrap; align-items: baseline; gap: 2px 8px; }
  h2 small { font-size: 13px; font-weight: 400; color: var(--muted); min-width: 0; overflow-wrap: anywhere; }
  .list { display: grid; gap: 6px; }
  .row { display: flex; align-items: center; gap: 10px; background: var(--panel); border: 1px solid var(--line); border-radius: 10px; padding: 8px 8px 8px 14px; }
  .row .name { flex: 1; min-width: 0; overflow-wrap: anywhere; font-size: 14px; }
  .row.active { border-color: var(--accent); }
  .row button { font-size: 13px; padding: 6px 12px; flex: none; }
  .empty.small { padding: 18px 0; font-size: 14px; }

  #editor { background: var(--panel); border: 1px solid var(--accent); border-radius: var(--radius); padding: 16px; margin-top: 12px; }
  .ed-head { display: flex; gap: 8px; align-items: flex-start; }
  .ed-head .title { flex: 1; font-weight: 600; overflow-wrap: anywhere; }
  .hint { color: var(--muted); font-size: 13px; margin: 4px 0 12px; }
  .wave { position: relative; height: 120px; background: var(--track); border-radius: 8px; overflow: hidden; }
  .wave canvas { display: block; width: 100%; height: 100%; touch-action: none; cursor: crosshair; }
  .wave .msg { position: absolute; inset: 0; display: grid; place-items: center; color: var(--muted); font-size: 14px; }
  .wave .msg[hidden] { display: none; }
  .range { display: flex; flex-wrap: wrap; align-items: center; gap: 8px 12px; margin-top: 12px; font-size: 14px; }
  .range label { display: flex; align-items: center; gap: 6px; }
  .range input { font: inherit; width: 92px; padding: 6px 8px; border-radius: 8px; border: 1px solid var(--line); background: var(--bg); color: var(--ink); font-variant-numeric: tabular-nums; }
  .range input.short { width: 64px; }
  .range button { font-size: 13px; padding: 6px 10px; }
  .range .len { color: var(--muted); font-variant-numeric: tabular-nums; }
  .range .len b { color: var(--ink); }
  .ed-actions { display: flex; gap: 8px; margin-top: 14px; flex-wrap: wrap; align-items: center; }
  .ed-actions button.primary { padding: 10px 18px; }
  .ed-actions button { padding: 10px 14px; }
  .job.fresh { border-color: var(--ok); }
  #cuts { display: grid; gap: 12px; }
  .testmode { background: var(--ink); color: var(--bg); font-size: 13px; text-align: center; padding: 6px 12px; border-radius: 8px; margin-bottom: 16px; }
</style>
</head>
<body>
<main>
  <div class="testmode" id="testmode" hidden>시험 모드 · 소리가 모두 꺼져 있습니다</div>
  <h1>yt<span>mp3</span></h1>
  <p class="sub">유튜브 링크를 넣으면 mp3 로 뽑아 저장 폴더에 넣습니다. 받은 곡은 원하는 구간만 잘라 따로 저장할 수 있습니다.</p>

  <form id="form" autocomplete="off" novalidate>
    <input id="url" type="url" placeholder="https://www.youtube.com/watch?v=…" aria-label="유튜브 링크" autofocus>
    <button class="primary" id="go" type="submit">mp3 뽑기</button>
  </form>
  <div class="formerr" id="formerr" role="alert"></div>

  <div class="folder" id="folder">
    저장 폴더 <code id="outText">…</code>
    <button class="linkbtn" type="button" id="outEdit">바꾸기</button>
  </div>

  <section id="jobs" aria-live="polite"></section>

  <h2>받은 곡 <small>골라서 구간을 자릅니다</small></h2>
  <section class="list" id="songs"></section>

  <section id="editor" hidden aria-label="구간 자르기">
    <div class="ed-head">
      <div class="title" id="edName"></div>
      <button class="linkbtn" type="button" id="edClose">닫기</button>
    </div>
    <p class="hint">파형을 끌어 구간을 고르고, 양 끝을 끌어 다듬습니다. 한 번 누르면 그 위치부터 재생합니다.</p>
    <div class="wave"><canvas id="wave" aria-label="파형"></canvas><div class="msg" id="waveMsg">파형 읽는 중…</div></div>
    <audio id="edAudio" controls preload="auto"></audio>
    <div class="range">
      <label>시작 <input id="edStart" inputmode="decimal" aria-label="시작 시간"></label>
      <button type="button" id="setStart">지금 위치로</button>
      <label>끝 <input id="edEnd" inputmode="decimal" aria-label="끝 시간"></label>
      <button type="button" id="setEnd">지금 위치로</button>
    </div>
    <div class="range">
      <span class="len">길이 <b id="edLen">–</b></span>
      <label>페이드 인 <input class="short" id="fadeIn" type="number" min="0" step="0.1" value="0">초</label>
      <label>페이드 아웃 <input class="short" id="fadeOut" type="number" min="0" step="0.1" value="0">초</label>
    </div>
    <div class="ed-actions">
      <button type="button" id="preview">▶ 구간 듣기</button>
      <button type="button" class="primary" id="doCut">잘라서 저장</button>
      <span class="status" id="edMsg" role="status"></span>
    </div>
  </section>

  <h2>잘라낸 곡 <small id="cutsDir"></small></h2>
  <section id="cuts" aria-live="polite"></section>
</main>

<script>
const $ = (s) => document.querySelector(s);
let outDir = null;           // 화면에서 고른 저장 폴더 (없으면 서버 기본값)
let defaultOut = "";
let canReveal = true;
let songs = [];
let jobs = [];
let timer = null;
const rendered = new Map(); // id → 카드 요소 (재생 중인 audio 를 다시 그리지 않으려고)

function store(key, value) { try { value == null ? localStorage.removeItem(key) : localStorage.setItem(key, value); } catch {} }
function load(key) { try { return localStorage.getItem(key); } catch { return null; } }

async function api(path, opts = {}) {
  const res = await fetch(path, { headers: { "Content-Type": "application/json" }, ...opts });
  const body = await res.json().catch(() => ({}));
  if (!res.ok) throw new Error(body.error || `요청 실패 (${res.status})`);
  return body;
}

function showFolder() {
  $("#outText").textContent = outDir || defaultOut;
}

$("#outEdit").addEventListener("click", () => {
  const box = $("#folder");
  box.innerHTML = "";
  const input = Object.assign(document.createElement("input"), { value: outDir || defaultOut, ariaLabel: "저장 폴더" });
  const save = Object.assign(document.createElement("button"), { type: "button", textContent: "저장" });
  const reset = Object.assign(document.createElement("button"), { type: "button", className: "linkbtn", textContent: "기본값" });
  const done = (value) => {
    outDir = value && value !== defaultOut ? value : null;
    store("ytmp3.outDir", outDir);
    location.reload();
  };
  save.onclick = () => done(input.value.trim());
  reset.onclick = () => done(null);
  input.onkeydown = (e) => { if (e.key === "Enter") save.click(); if (e.key === "Escape") location.reload(); };
  box.append("저장 폴더 ", input, save, reset);
  input.focus(); input.select();
});

$("#form").addEventListener("submit", async (e) => {
  e.preventDefault();
  const url = $("#url").value.trim();
  $("#formerr").textContent = "";
  if (!url) { $("#formerr").textContent = "유튜브 링크를 넣어 주세요."; return; }
  $("#go").disabled = true;
  try {
    const job = await api("api/jobs", { method: "POST", body: JSON.stringify({ url, out_dir: outDir }) });
    jobs.unshift(job);
    $("#url").value = "";
    render();
    poll();
  } catch (err) {
    $("#formerr").textContent = err.message;
  } finally {
    $("#go").disabled = false;
    $("#url").focus();
  }
});

function fmtDuration(sec) {
  if (sec == null) return "";
  sec = Math.round(sec);
  return `${Math.floor(sec / 60)}:${String(sec % 60).padStart(2, "0")}`;
}

function card(job) {
  let el = rendered.get(job.id);
  const key = `${job.status}|${job.message}|${job.percent}|${job.title}`;
  if (el && el.dataset.key === key) return el;
  // 끝난 카드는 다시 그리지 않는다 — 재생 중인 소리가 끊긴다.
  if (el && el.dataset.status === "done" && job.status === "done") return el;
  const fresh = document.createElement("article");
  fresh.className = "job";
  fresh.dataset.key = key;
  fresh.dataset.status = job.status;
  fresh.dataset.id = job.id;

  const title = document.createElement("div");
  title.className = "title";
  title.textContent = job.title || job.url;
  const meta = document.createElement("div");
  meta.className = "meta";
  meta.textContent = job.status === "done" ? job.path : job.url;
  fresh.append(title, meta);

  if (job.status === "queued" || job.status === "running") {
    const bar = document.createElement("div");
    bar.className = "bar" + (job.percent == null || job.message !== "받는 중" ? " indeterminate" : "");
    const fill = document.createElement("i");
    if (!bar.classList.contains("indeterminate")) fill.style.width = `${job.percent}%`;
    bar.append(fill);
    const st = document.createElement("div");
    st.className = "status";
    st.textContent = job.message === "받는 중" && job.percent != null ? `받는 중 ${job.percent}%` : job.message;
    fresh.append(bar, st);
  } else if (job.status === "error") {
    const st = document.createElement("div");
    st.className = "status err";
    st.textContent = job.error;
    fresh.append(st);
  } else {
    const st = document.createElement("div");
    st.className = "status ok";
    st.textContent = (job.already_existed ? "이미 있던 파일" : "저장 완료") + (job.duration ? ` · ${fmtDuration(job.duration)}` : "");
    const audio = document.createElement("audio");
    audio.controls = true;
    audio.preload = "metadata";
    audio.src = `api/jobs/${job.id}/audio`;
    const actions = document.createElement("div");
    actions.className = "actions";
    const reveal = Object.assign(document.createElement("button"), { type: "button", textContent: "Finder 에서 보기" });
    reveal.hidden = !canReveal;
    reveal.onclick = () => api(`api/jobs/${job.id}/reveal`, { method: "POST" }).catch((e) => alertInline(fresh, e.message));
    const copy = Object.assign(document.createElement("button"), { type: "button", textContent: "경로 복사" });
    copy.onclick = async () => {
      try { await navigator.clipboard.writeText(job.path); copy.textContent = "복사됨"; }
      catch { copy.textContent = "복사 실패"; }
      setTimeout(() => (copy.textContent = "경로 복사"), 1500);
    };
    const save = Object.assign(document.createElement("a"), {
      href: `api/jobs/${job.id}/audio?download=1`, textContent: "다운로드", className: "btn",
    });
    save.setAttribute("download", job.file);
    actions.append(save, reveal, copy);
    if (job.out_dir === defaultOut) {
      const cut = Object.assign(document.createElement("button"), { type: "button", textContent: "구간 자르기" });
      cut.onclick = () => openEditor(job.file);
      actions.append(cut);
    }
    fresh.append(st, audio, actions);
  }
  if (el) el.replaceWith(fresh);
  rendered.set(job.id, fresh);
  return fresh;
}

function alertInline(el, msg) {
  const st = el.querySelector(".status");
  if (st) { st.className = "status err"; st.textContent = msg; }
}

function render() {
  const box = $("#jobs");
  if (!jobs.length) {
    box.innerHTML = '<div class="empty">유튜브 링크를 붙여넣으면 여기에 받는 과정이 나옵니다.</div>';
    return;
  }
  box.querySelector(".empty")?.remove();
  jobs.forEach((job, i) => {
    const el = card(job);
    if (box.children[i] !== el) box.insertBefore(el, box.children[i] || null);
  });
}

let doneCount = -1;
async function refresh() {
  jobs = await api("api/jobs");
  render();
  const done = jobs.filter((j) => j.status === "done").length;
  if (done !== doneCount) { doneCount = done; loadSongs(); }
  return jobs.some((j) => j.status === "queued" || j.status === "running");
}

function poll() {
  clearTimeout(timer);
  const tick = async () => {
    let busy = true;
    try { busy = await refresh(); } catch { /* 서버가 잠깐 안 되면 다음에 다시 */ }
    if (busy) timer = setTimeout(tick, 600);
  };
  timer = setTimeout(tick, 300);
}

/* ---------- 받은 곡 · 구간 자르기 · 잘라낸 곡 ---------- */
const enc = encodeURIComponent;
const ed = { name: null, duration: 0, peaks: [], start: 0, end: 0, previewing: false, drag: null, raf: 0 };
const audio = $("#edAudio");
const canvas = $("#wave");

function fmt(t) {
  t = Math.round(t * 100) / 100;
  const m = Math.floor(t / 60), s = t - m * 60;
  const frac = (s % 1).toFixed(2).slice(1).replace(/0+$/, "").replace(/\.$/, "");
  return `${m}:${String(Math.floor(s)).padStart(2, "0")}${frac}`;
}
function parseTime(text) {
  const m = String(text).trim().match(/^(?:(?:(\d+):)?(\d+):)?(\d+(?:\.\d+)?)$/);
  if (!m) return null;
  return (+(m[1] || 0)) * 3600 + (+(m[2] || 0)) * 60 + parseFloat(m[3]);
}
const r2 = (t) => Math.round(t * 100) / 100;

function empty(text) { return Object.assign(document.createElement("div"), { className: "empty small", textContent: text }); }

async function loadSongs() {
  try { songs = await api("api/songs"); } catch { return; }
  const box = $("#songs");
  box.replaceChildren();
  if (!songs.length) { box.append(empty("받은 곡이 없습니다. 위에서 먼저 받아 주세요.")); return; }
  for (const s of songs) {
    const row = Object.assign(document.createElement("div"), { className: "row" + (s.name === ed.name ? " active" : "") });
    row.append(Object.assign(document.createElement("span"), { className: "name", textContent: s.name }));
    const b = Object.assign(document.createElement("button"), { type: "button", textContent: "자르기" });
    b.onclick = () => openEditor(s.name);
    row.append(b);
    box.append(row);
  }
}

async function loadCuts(fresh) {
  let cuts = [];
  try { cuts = await api("api/cuts"); } catch { return; }
  const box = $("#cuts");
  box.replaceChildren();
  if (!cuts.length) { box.append(empty("아직 잘라낸 곡이 없습니다.")); return; }
  for (const c of cuts) {
    const card = Object.assign(document.createElement("article"), { className: "job" + (c.name === fresh ? " fresh" : "") });
    card.append(Object.assign(document.createElement("div"), { className: "title", textContent: c.name }));
    const a = Object.assign(document.createElement("audio"), { controls: true, preload: c.name === fresh ? "metadata" : "none" });
    a.src = `api/cuts/${enc(c.name)}/audio`;
    const dl = Object.assign(document.createElement("a"), { href: `api/cuts/${enc(c.name)}/audio?download=1`, textContent: "다운로드", className: "btn" });
    dl.setAttribute("download", c.name);
    const actions = Object.assign(document.createElement("div"), { className: "actions" });
    actions.append(dl);
    card.append(a, actions);
    box.append(card);
  }
}

async function openEditor(name) {
  stopPreview();
  Object.assign(ed, { name, duration: 0, peaks: [], start: 0, end: 0 });
  $("#editor").hidden = false;
  $("#edName").textContent = name;
  $("#edMsg").textContent = ""; $("#edMsg").className = "status";
  $("#waveMsg").textContent = "파형 읽는 중…"; $("#waveMsg").hidden = false;
  audio.src = `api/songs/${enc(name)}/audio`;
  syncInputs(); loadSongs();
  $("#editor").scrollIntoView({ behavior: "smooth", block: "nearest" });
  try {
    const w = await api(`api/songs/${enc(name)}/peaks?n=1200`);
    if (ed.name !== name) return;
    Object.assign(ed, { duration: w.duration, peaks: w.peaks, start: 0, end: r2(w.duration) });
    $("#waveMsg").hidden = true;
  } catch (e) {
    $("#waveMsg").textContent = e.message;
  }
  syncInputs(); draw();
}

$("#edClose").onclick = () => { stopPreview(); audio.removeAttribute("src"); audio.load(); ed.name = null; $("#editor").hidden = true; loadSongs(); };

function syncInputs() {
  $("#edStart").value = ed.duration ? fmt(ed.start) : "";
  $("#edEnd").value = ed.duration ? fmt(ed.end) : "";
  $("#edLen").textContent = ed.duration ? `${fmt(ed.end - ed.start)} / ${fmt(ed.duration)}` : "–";
  $("#doCut").disabled = $("#preview").disabled = !ed.duration;
}

function color(name) { return getComputedStyle(document.documentElement).getPropertyValue(name).trim(); }

function draw() {
  const dpr = window.devicePixelRatio || 1;
  const w = canvas.clientWidth, h = canvas.clientHeight;
  if (canvas.width !== Math.round(w * dpr) || canvas.height !== Math.round(h * dpr)) {
    canvas.width = Math.round(w * dpr); canvas.height = Math.round(h * dpr);
  }
  const g = canvas.getContext("2d");
  g.setTransform(dpr, 0, 0, dpr, 0, 0);
  g.clearRect(0, 0, w, h);
  if (!ed.duration) return;
  const X = (t) => (t / ed.duration) * w;
  const xs = X(ed.start), xe = X(ed.end);
  g.fillStyle = color("--sel");
  g.fillRect(xs, 0, xe - xs, h);
  const n = ed.peaks.length, mid = h / 2, bar = 2, gap = 1;
  const on = color("--accent"), off = color("--wave");
  for (let x = 0; x < w; x += bar + gap) {
    const i0 = Math.floor((x / w) * n), i1 = Math.max(i0 + 1, Math.floor(((x + bar + gap) / w) * n));
    let p = 0;
    for (let i = i0; i < i1 && i < n; i++) p = Math.max(p, ed.peaks[i]);
    const bh = Math.max(1, p * (h - 12));
    g.fillStyle = x + bar >= xs && x <= xe ? on : off;
    g.fillRect(x, mid - bh / 2, bar, bh);
  }
  g.fillStyle = on;
  for (const x of [xs, xe]) {
    g.fillRect(Math.round(x) - 1, 0, 2, h);
    g.fillRect(Math.round(x) - 5, 0, 10, 8);
    g.fillRect(Math.round(x) - 5, h - 8, 10, 8);
  }
  if (audio.getAttribute("src") && !isNaN(audio.currentTime)) {
    g.fillStyle = color("--ink");
    g.fillRect(Math.round(X(audio.currentTime)), 0, 1, h);
  }
}

function tick() {
  if (ed.previewing && audio.currentTime >= ed.end) { audio.pause(); audio.currentTime = ed.end; }
  draw();
  ed.raf = audio.paused ? 0 : requestAnimationFrame(tick);
}
audio.addEventListener("play", () => { cancelAnimationFrame(ed.raf); ed.raf = requestAnimationFrame(tick); });
audio.addEventListener("pause", () => {
  if (!audio.paused) return;  // 앞서 멈춘 것의 늦게 온 알림 — 그사이 구간 듣기가 다시 시작됐다
  ed.previewing = false; $("#preview").textContent = "▶ 구간 듣기"; draw();
});
audio.addEventListener("seeked", draw);
window.addEventListener("resize", draw);

function stopPreview() { ed.previewing = false; if (!audio.paused) audio.pause(); }

$("#preview").onclick = () => {
  if (ed.previewing) return stopPreview();
  audio.currentTime = ed.start;
  ed.previewing = true;
  $("#preview").textContent = "■ 멈춤";
  audio.play().catch(() => { ed.previewing = false; });
};

function timeAt(e) {
  const r = canvas.getBoundingClientRect();
  return r2(Math.min(1, Math.max(0, (e.clientX - r.left) / r.width)) * ed.duration);
}
const MIN_LEN = 0.05;
canvas.addEventListener("pointerdown", (e) => {
  if (!ed.duration) return;
  canvas.setPointerCapture(e.pointerId);
  const r = canvas.getBoundingClientRect();
  const px = e.clientX - r.left, X = (t) => (t / ed.duration) * r.width;
  const near = e.pointerType === "touch" ? 22 : 10;
  const ds = Math.abs(px - X(ed.start)), de = Math.abs(px - X(ed.end));
  if (ds <= near && ds <= de) ed.drag = { mode: "start" };
  else if (de <= near) ed.drag = { mode: "end" };
  else ed.drag = { mode: "new", anchor: timeAt(e), x0: px, moved: false };
});
canvas.addEventListener("pointermove", (e) => {
  const d = ed.drag;
  if (!d) return;
  const t = timeAt(e);
  if (d.mode === "start") ed.start = Math.min(t, r2(ed.end - MIN_LEN));
  else if (d.mode === "end") ed.end = Math.max(t, r2(ed.start + MIN_LEN));
  else {
    if (Math.abs(e.clientX - canvas.getBoundingClientRect().left - d.x0) > 4) d.moved = true;
    if (!d.moved) return;
    ed.start = Math.min(d.anchor, t); ed.end = Math.max(d.anchor, t);
    if (ed.end - ed.start < MIN_LEN) ed.end = Math.min(ed.duration, r2(ed.start + MIN_LEN));
  }
  syncInputs(); draw();
});
function endDrag(e) {
  const d = ed.drag;
  ed.drag = null;
  if (d && d.mode === "new" && !d.moved && e.type === "pointerup") {
    ed.previewing = false;
    audio.currentTime = timeAt(e);
    audio.play().catch(() => {});
  }
}
canvas.addEventListener("pointerup", endDrag);
canvas.addEventListener("pointercancel", endDrag);

function setFromInput(which) {
  const input = which === "start" ? $("#edStart") : $("#edEnd");
  const t = parseTime(input.value);
  const msg = $("#edMsg");
  if (t == null || t > ed.duration) {
    msg.className = "status err";
    msg.textContent = t == null ? `시간 형식이 아닙니다: ${input.value} (예: 1:23.5 또는 83.5)` : `곡 길이(${fmt(ed.duration)})를 넘습니다`;
    return syncInputs();
  }
  if (which === "start") { ed.start = r2(t); if (ed.end - ed.start < MIN_LEN) ed.end = Math.min(ed.duration, r2(ed.start + MIN_LEN)); }
  else { ed.end = r2(t); if (ed.end - ed.start < MIN_LEN) ed.start = Math.max(0, r2(ed.end - MIN_LEN)); }
  msg.textContent = "";
  syncInputs(); draw();
}
for (const which of ["start", "end"]) {
  const input = which === "start" ? $("#edStart") : $("#edEnd");
  input.addEventListener("change", () => setFromInput(which));
  input.addEventListener("keydown", (e) => { if (e.key === "Enter") input.blur(); });
}
$("#setStart").onclick = () => {
  if (!ed.duration) return;
  ed.start = r2(audio.currentTime || 0);
  if (ed.end - ed.start < MIN_LEN) ed.end = r2(ed.duration);
  syncInputs(); draw();
};
$("#setEnd").onclick = () => {
  if (!ed.duration) return;
  ed.end = r2(audio.currentTime || 0);
  if (ed.end - ed.start < MIN_LEN) ed.start = 0;
  syncInputs(); draw();
};

$("#doCut").onclick = async () => {
  const btn = $("#doCut"), msg = $("#edMsg");
  btn.disabled = true;
  msg.className = "status"; msg.textContent = "자르는 중…";
  try {
    const c = await api("api/cuts", { method: "POST", body: JSON.stringify({
      song: ed.name, start: ed.start, end: ed.end,
      fade_in: parseFloat($("#fadeIn").value) || 0, fade_out: parseFloat($("#fadeOut").value) || 0,
    }) });
    msg.className = "status ok";
    msg.textContent = `저장했습니다 · ${fmt(c.duration)} → 아래 잘라낸 곡`;
    await loadCuts(c.file);
  } catch (e) {
    msg.className = "status err"; msg.textContent = e.message;
  } finally {
    btn.disabled = !ed.duration;
  }
};

(async () => {
  outDir = load("ytmp3.outDir");
  try {
    const cfg = await api("api/config");
    defaultOut = cfg.out_dir;
    if (cfg.test_mode) {
      // 시험 모드: 어떤 재생이든 시작되는 순간 음소거 (play 는 버블링하지 않아 캡처로 받는다)
      $("#testmode").hidden = false;
      const mute = (a) => { a.muted = true; a.volume = 0; };
      document.querySelectorAll("audio").forEach(mute);
      document.addEventListener("play", (e) => mute(e.target), true);
      document.addEventListener("volumechange", (e) => { if (!e.target.muted) mute(e.target); }, true);
    }
    $("#cutsDir").textContent = cfg.cuts_dir;
    canReveal = cfg.can_reveal;
    if (!cfg.can_change_out) { outDir = null; $("#outEdit").hidden = true; }
  } catch {}
  showFolder();
  loadCuts();
  try { if (await refresh()) poll(); } catch { render(); loadSongs(); }
})();
</script>
</body>
</html>
