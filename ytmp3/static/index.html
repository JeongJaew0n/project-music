<!doctype html>
<html lang="ko" data-ui-store="ytmp3">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="light dark">
<title>ytmp3</title>
<link rel="icon" href="data:,">
<!-- ui-kit 사본 (ytmp3/static/vendor/ui-kit, 고치지 않는다 — 판 올리기는 node ~/my/Dev/ui-kit/tools/adopt.mjs) -->
<link rel="stylesheet" href="static/vendor/ui-kit/tokens.css">
<link rel="stylesheet" href="static/vendor/ui-kit/components.css">
<script src="static/vendor/ui-kit/ui.js"></script>
<style>
  /* 이 화면만의 것. 크기·색은 키트 토큰만 쓴다. 이름은 ui- 로 시작하지 않는다(키트와 부딪히지 않게). */
  .stack { display: flex; flex-direction: column; gap: var(--ui-gutter); }
  .gap { display: flex; flex-direction: column; gap: var(--ui-space-16); }
  .gap > :is(h2, p) { margin: 0; }
  .back { align-self: flex-start; }

  .ui-field .ui-help:empty { display: none; }

  .ui-banner .ui-txt { display: flex; flex-direction: column; }
  .ui-d.folder-path { white-space: normal; }
  .folder-path { font-family: var(--ui-font-mono, ui-monospace, monospace); font-size: var(--ui-fs-sub); overflow-wrap: anywhere; }

  .job-title, .cut-title { font-size: var(--ui-fs-body-l); font-weight: 700; overflow-wrap: anywhere; }
  .job-meta { color: var(--ui-t4); font-size: var(--ui-fs-sub); overflow-wrap: anywhere; margin-top: var(--ui-space-4); }
  .job-status { display: flex; align-items: center; gap: var(--ui-space-8); flex-wrap: wrap; color: var(--ui-t4); font-size: var(--ui-fs-sub); }
  .err-text { color: var(--ui-danger-t); font-size: var(--ui-fs-sub); overflow-wrap: anywhere; }
  audio { width: 100%; display: block; }

  /* 진행률을 모를 때: 막대가 오간다. 동작 줄이기에서는 멈춘 반쯤 찬 막대 */
  .ui-progress.indet > i { width: 30%; animation: ytm-slide calc(1.1s / max(var(--ui-motion, 1), .01)) ease-in-out infinite; }
  @keyframes ytm-slide { from { transform: translateX(-100%); } to { transform: translateX(340%); } }
  @media (prefers-reduced-motion: reduce) { .ui-progress.indet > i { animation: none; width: 50%; } }

  .song-name { overflow-wrap: anywhere; }
  /* 유튜브 제목은 길다 — 목록에서 한 줄로 자르지 않고 두 줄까지 */
  .ui-row .ui-t.song-name { white-space: normal; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }

  .wave { position: relative; height: calc(var(--ui-space-32) * 4); background: var(--ui-fill); border-radius: var(--ui-r-12); overflow: hidden; }
  .wave canvas { display: block; width: 100%; height: 100%; touch-action: none; cursor: crosshair; }
  .wave-msg { position: absolute; inset: 0; display: grid; place-items: center; color: var(--ui-t4); font-size: var(--ui-fs-sub); padding: var(--ui-space-16); text-align: center; }
  .wave-msg[hidden] { display: none; }
  .times { display: grid; grid-template-columns: 1fr 1fr; gap: var(--ui-space-12); }
  .times .ui-input { font-variant-numeric: tabular-nums; }
  .times .ui-btn { width: 100%; }
  .len { color: var(--ui-t4); font-size: var(--ui-fs-sub); font-variant-numeric: tabular-nums; }
  .len b { color: var(--ui-t1); }
  .msg { min-height: 1.4em; font-size: var(--ui-fs-sub); color: var(--ui-t4); overflow-wrap: anywhere; }
  .msg.err { color: var(--ui-danger-t); }

  /* 주 버튼 글자 대비 4.5 — 키트 0.3.2 의 흰 글자 × 포인트 색은 3.3~3.7 이라 바탕을 한 단계 짙게 한다.
     누름·올림은 더 짙게(흰 글자라 짙을수록 대비가 오른다). 키트가 고치면 이 묶음을 뺀다 (tests/ui/screen.mjs 가 지킨다). */
  .ui-btn.ui-primary { --ytm-primary: var(--ui-accent-press); --ytm-shade: var(--ui-t1); background: var(--ytm-primary); }
  :root[data-ui-mode="dark"] .ui-btn.ui-primary { --ytm-primary: color-mix(in oklab, var(--ui-accent-press) 78%, var(--ui-bg)); --ytm-shade: var(--ui-bg); }
  .ui-btn.ui-primary:active:not(:disabled) { background: color-mix(in oklab, var(--ytm-primary) 82%, var(--ytm-shade)); }
  @media (hover: hover) and (pointer: fine) {
    .ui-btn.ui-primary:hover:not(:active):not(:disabled) { background: color-mix(in oklab, var(--ytm-primary) 92%, var(--ytm-shade)); }
  }
</style>
</head>
<body class="ui-app">
<header class="ui-gnb"><div class="ui-in">
  <a class="ui-logo" href="#get"><span class="ui-logo-mark" data-ui-icon="spark"></span>ytmp3</a>
  <nav data-ui-nav="gnb" aria-label="주 메뉴"></nav>
  <div class="ui-right"><button type="button" class="ui-round-btn ui-s" data-ui-theme data-ui-icon="moon" aria-label="밝게·어둡게"></button></div>
</div></header>
<header class="ui-topbar"><div class="ui-in">
  <span class="ui-brand">ytmp3</span><span class="ui-spacer"></span>
  <button type="button" class="ui-icon-btn" data-ui-theme data-ui-icon="moon" aria-label="밝게·어둡게"></button>
</div></header>

<main class="ui-wrap ui-main">
  <section class="ui-card ui-banner" id="testmode" hidden>
    <span class="ui-tile ui-s ui-warning" data-ui-icon="info"></span>
    <div class="ui-txt"><span class="ui-t">시험 모드</span><span class="ui-d">소리가 모두 꺼져 있어요</span></div>
  </section>

  <!-- 받기 -->
  <section class="stack" id="view-get" aria-labelledby="h-get">
    <div class="ui-page-h"><h1 id="h-get">받기</h1><p>유튜브 링크를 넣으면 mp3 로 뽑아 받은 곡에 넣어요.</p></div>
    <section class="ui-card ui-card-pad">
      <form class="gap" id="form" autocomplete="off" novalidate>
        <div class="ui-field" id="urlField">
          <label for="url">유튜브 링크</label>
          <input class="ui-input" id="url" type="url" inputmode="url" placeholder="https://www.youtube.com/watch?v=…" aria-describedby="formerr">
          <p class="ui-help" id="formerr" role="alert"></p>
        </div>
        <button class="ui-btn ui-primary ui-l ui-block" id="go" type="submit">mp3 뽑기</button>
      </form>
    </section>
    <section class="ui-card"><div class="ui-rows">
      <div class="ui-row ui-static">
        <span class="ui-tile ui-s ui-accent" data-ui-icon="folder"></span>
        <div class="ui-txt"><span class="ui-t">저장 폴더</span><span class="ui-d folder-path" id="outText">…</span></div>
        <button type="button" class="ui-btn ui-neutral ui-m" id="outEdit">바꾸기</button>
      </div>
    </div></section>
    <div class="stack" id="jobs" aria-live="polite"></div>
  </section>

  <!-- 받은 곡 · 구간 자르기 -->
  <section class="stack" id="view-songs" aria-labelledby="h-songs" hidden>
    <div class="ui-page-h"><h1 id="h-songs">받은 곡</h1><p>곡을 골라 원하는 구간만 잘라요.</p></div>
    <div class="ui-list-detail" id="songsLD">
      <div class="ui-list-pane"><section class="ui-card"><div class="ui-rows" id="songs"></div></section></div>
      <div class="ui-detail-pane">
        <section class="ui-card" id="edEmpty"><div class="ui-empty"><svg data-ui-icon="edit"></svg>곡을 고르면 여기서 잘라요</div></section>
        <section class="ui-card ui-card-pad gap" id="editor" aria-labelledby="edName" hidden>
          <button type="button" class="ui-btn ui-text ui-m back" data-ui-back data-ui-icon="back">목록</button>
          <h2 class="ui-h3 song-name" id="edName"></h2>
          <p class="ui-muted" id="edHint">파형을 끌어 구간을 고르고, 양 끝을 끌어 다듬어요. 한 번 누르면 그 자리부터 재생해요.</p>
          <div class="wave"><canvas id="wave" role="img" aria-label="파형과 고른 구간" aria-describedby="edHint"></canvas><div class="wave-msg" id="waveMsg">파형 읽는 중…</div></div>
          <audio id="edAudio" controls preload="auto"></audio>
          <div class="times">
            <div class="gap">
              <div class="ui-field"><label for="edStart">시작</label><input class="ui-input" id="edStart" inputmode="decimal" autocomplete="off"></div>
              <button type="button" class="ui-btn ui-neutral ui-m" id="setStart">지금 위치로</button>
            </div>
            <div class="gap">
              <div class="ui-field"><label for="edEnd">끝</label><input class="ui-input" id="edEnd" inputmode="decimal" autocomplete="off"></div>
              <button type="button" class="ui-btn ui-neutral ui-m" id="setEnd">지금 위치로</button>
            </div>
            <div class="ui-field"><label for="fadeIn">페이드 인 (초)</label><input class="ui-input" id="fadeIn" type="number" min="0" step="0.1" value="0"></div>
            <div class="ui-field"><label for="fadeOut">페이드 아웃 (초)</label><input class="ui-input" id="fadeOut" type="number" min="0" step="0.1" value="0"></div>
          </div>
          <p class="len">길이 <b id="edLen">–</b></p>
          <div class="ui-ctas">
            <button type="button" class="ui-btn ui-weak ui-xl" id="preview">구간 듣기</button>
            <button type="button" class="ui-btn ui-primary ui-xl" id="doCut">잘라서 저장</button>
          </div>
          <p class="msg" id="edMsg" role="status"></p>
        </section>
      </div>
    </div>
  </section>

  <!-- 잘라낸 곡 -->
  <section class="stack" id="view-cuts" aria-labelledby="h-cuts" hidden>
    <div class="ui-page-h"><h1 id="h-cuts">잘라낸 곡</h1><p class="folder-path" id="cutsDir"></p></div>
    <div class="stack" id="cuts" aria-live="polite"></div>
  </section>
</main>

<nav class="ui-tabbar" aria-label="하단 메뉴"><div class="ui-in" data-ui-nav="tabbar"></div></nav>

<script>
const $ = (s) => document.querySelector(s);
const enc = encodeURIComponent;
let outDir = null;           // 화면에서 고른 저장 폴더 (없으면 서버 기본값)
let defaultOut = "";
let canReveal = true;
let jobs = [];
let timer = null;
let lastCut = null;          // 방금 잘라낸 곡 이름 (잘라낸 곡 화면에서 표시)
const rendered = new Map(); // id → 카드 요소 (재생 중인 audio 를 다시 그리지 않으려고)

function store(key, value) { try { value == null ? localStorage.removeItem(key) : localStorage.setItem(key, value); } catch {} }
function load(key) { try { return localStorage.getItem(key); } catch { return null; } }
function el(tag, props = {}, ...children) {
  const node = Object.assign(document.createElement(tag), props);
  node.append(...children.filter((c) => c != null));
  return node;
}

async function api(path, opts = {}) {
  const res = await fetch(path, { headers: { "Content-Type": "application/json" }, ...opts });
  const body = await res.json().catch(() => ({}));
  if (!res.ok) throw new Error(body.error || `요청이 실패했어요 (${res.status})`);
  return body;
}

/* ---------- 화면 셋: 받기 · 받은 곡 · 잘라낸 곡 ---------- */
const VIEWS = ["get", "songs", "cuts"];
UI.nav({
  items: [
    { id: "get", label: "받기", icon: "plus", href: "#get" },
    { id: "songs", label: "받은 곡", icon: "edit", href: "#songs" },
    { id: "cuts", label: "잘라낸 곡", icon: "folder", href: "#cuts" },
  ],
  current: "get",
});
function route() {
  const id = VIEWS.includes(location.hash.slice(1)) ? location.hash.slice(1) : "get";
  for (const v of VIEWS) $(`#view-${v}`).hidden = v !== id;
  UI.nav.set(id);
  if (id !== "songs") stopPreview();
  if (id === "songs") { loadSongs(); requestAnimationFrame(draw); }
  if (id === "cuts") loadCuts();
}
window.addEventListener("hashchange", route);

/* ---------- 받기 ---------- */
function showFolder() { $("#outText").textContent = outDir || defaultOut; }

$("#outEdit").addEventListener("click", () => {
  const input = el("input", { className: "ui-input", id: "outInput", value: outDir || defaultOut, autocomplete: "off" });
  const save = el("button", { type: "button", className: "ui-btn ui-primary ui-xl", textContent: "저장" });
  const reset = el("button", { type: "button", className: "ui-btn ui-neutral ui-xl", textContent: "기본값" });
  const done = (value) => {
    outDir = value && value !== defaultOut ? value : null;
    store("ytmp3.outDir", outDir);
    showFolder();
    UI.sheet.close();
    UI.toast(outDir ? "저장 폴더를 바꿨어요" : "기본 저장 폴더로 돌렸어요");
  };
  save.onclick = () => done(input.value.trim());
  reset.onclick = () => done(null);
  input.onkeydown = (e) => { if (e.key === "Enter") save.click(); };
  const label = el("label", { htmlFor: "outInput", textContent: "폴더 (절대 경로)" });
  UI.sheet.open(el("div", {},
    el("h3", { className: "ui-h3", textContent: "저장 폴더" }),
    el("div", { className: "ui-field" }, label, input),
    el("div", { className: "ui-ctas" }, reset, save)));
  input.focus(); input.select();
});

function formError(msg) {
  $("#formerr").textContent = msg;
  $("#urlField").classList.toggle("ui-error", !!msg);
}

$("#form").addEventListener("submit", async (e) => {
  e.preventDefault();
  const url = $("#url").value.trim();
  formError("");
  if (!url) { formError("유튜브 링크를 넣어 주세요."); $("#url").focus(); return; }
  $("#go").disabled = true;
  try {
    const job = await api("api/jobs", { method: "POST", body: JSON.stringify({ url, out_dir: outDir }) });
    jobs.unshift(job);
    $("#url").value = "";
    render();
    poll();
  } catch (err) {
    formError(err.message);
  } finally {
    $("#go").disabled = false;
    $("#url").focus();
  }
});

function fmtDuration(sec) {
  if (sec == null) return "";
  sec = Math.round(sec);
  return `${Math.floor(sec / 60)}:${String(sec % 60).padStart(2, "0")}`;
}

function card(job) {
  const old = rendered.get(job.id);
  const key = `${job.status}|${job.message}|${job.percent}|${job.title}`;
  if (old && old.dataset.key === key) return old;
  // 끝난 카드는 다시 그리지 않는다 — 재생 중인 소리가 끊긴다.
  if (old && old.dataset.status === "done" && job.status === "done") return old;
  const fresh = el("article", { className: "ui-card ui-card-pad gap" });
  Object.assign(fresh.dataset, { key, status: job.status, id: job.id });
  fresh.append(el("div", {},
    el("div", { className: "job-title", textContent: job.title || job.url }),
    el("div", { className: "job-meta", textContent: job.status === "done" ? job.path : job.url })));

  if (job.status === "queued" || job.status === "running") {
    const known = job.percent != null && job.message === "받는 중";
    const fill = el("i");
    if (known) fill.style.width = `${job.percent}%`;
    const bar = el("div", { className: "ui-progress" + (known ? "" : " indet"), role: "progressbar" }, fill);
    bar.setAttribute("aria-label", "진행");
    if (known) bar.setAttribute("aria-valuenow", job.percent);
    fresh.append(bar, el("div", { className: "job-status", textContent: known ? `받는 중 ${job.percent}%` : job.message }));
  } else if (job.status === "error") {
    fresh.append(el("div", { className: "job-status" }, el("span", { className: "ui-badge ui-danger", textContent: "못 받았어요" })),
      el("p", { className: "err-text", textContent: job.error }));
  } else {
    const badge = el("span", { className: "ui-badge ui-success", textContent: job.already_existed ? "이미 있던 파일" : "저장했어요" });
    const status = el("div", { className: "job-status" }, badge, job.duration ? el("span", { textContent: fmtDuration(job.duration) }) : null);
    const player = el("audio", { controls: true, preload: "metadata", src: `api/jobs/${job.id}/audio` });
    const save = el("a", { href: `api/jobs/${job.id}/audio?download=1`, textContent: "다운로드", className: "ui-btn ui-weak ui-m" });
    save.setAttribute("download", job.file);
    const reveal = el("button", { type: "button", className: "ui-btn ui-neutral ui-m", textContent: "Finder 에서 보기", hidden: !canReveal });
    reveal.onclick = () => api(`api/jobs/${job.id}/reveal`, { method: "POST" }).catch((e) => UI.toast(e.message, { type: "err" }));
    const copy = el("button", { type: "button", className: "ui-btn ui-neutral ui-m", textContent: "경로 복사" });
    copy.onclick = async () => {
      try { await navigator.clipboard.writeText(job.path); UI.toast("경로를 복사했어요"); }
      catch { UI.toast("복사하지 못했어요", { type: "err" }); }
    };
    const row = el("div", { className: "ui-btn-row" }, save, reveal, copy);
    if (job.out_dir === defaultOut) {
      const cut = el("button", { type: "button", className: "ui-btn ui-neutral ui-m", textContent: "구간 자르기" });
      cut.onclick = () => openSong(job.file);
      row.append(cut);
    }
    fresh.append(status, player, row);
  }
  if (old) old.replaceWith(fresh);
  rendered.set(job.id, fresh);
  return fresh;
}

function render() {
  const box = $("#jobs");
  if (!jobs.length) {
    box.replaceChildren(el("section", { className: "ui-card" },
      el("div", { className: "ui-empty", textContent: "링크를 넣으면 여기에 받는 과정이 나와요." })));
    return;
  }
  [...box.children].forEach((c) => { if (!c.dataset.id) c.remove(); });
  jobs.forEach((job, i) => {
    const node = card(job);
    if (box.children[i] !== node) box.insertBefore(node, box.children[i] || null);
  });
}

let doneCount = -1;
async function refresh() {
  jobs = await api("api/jobs");
  render();
  const done = jobs.filter((j) => j.status === "done").length;
  if (done !== doneCount) { doneCount = done; loadSongs(); }
  return jobs.some((j) => j.status === "queued" || j.status === "running");
}

function poll() {
  clearTimeout(timer);
  const tick = async () => {
    let busy = true;
    try { busy = await refresh(); } catch { /* 서버가 잠깐 안 되면 다음에 다시 */ }
    if (busy) timer = setTimeout(tick, 600);
  };
  timer = setTimeout(tick, 300);
}

/* ---------- 받은 곡 · 구간 자르기 ---------- */
const ed = { name: null, duration: 0, peaks: [], start: 0, end: 0, previewing: false, drag: null, raf: 0 };
const audio = $("#edAudio");
const canvas = $("#wave");
const ld = $("#songsLD");

function fmt(t) {
  t = Math.round(t * 100) / 100;
  const m = Math.floor(t / 60), s = t - m * 60;
  const frac = (s % 1).toFixed(2).slice(1).replace(/0+$/, "").replace(/\.$/, "");
  return `${m}:${String(Math.floor(s)).padStart(2, "0")}${frac}`;
}
function parseTime(text) {
  const m = String(text).trim().match(/^(?:(?:(\d+):)?(\d+):)?(\d+(?:\.\d+)?)$/);
  if (!m) return null;
  return (+(m[1] || 0)) * 3600 + (+(m[2] || 0)) * 60 + parseFloat(m[3]);
}
const r2 = (t) => Math.round(t * 100) / 100;
function fmtSize(bytes) { return `${(bytes / 1048576).toFixed(1)}MB`; }
function fmtDate(sec) { return new Date(sec * 1000).toLocaleDateString("ko-KR", { month: "long", day: "numeric" }); }

async function loadSongs() {
  let songs;
  try { songs = await api("api/songs"); } catch { return; }
  const box = $("#songs");
  if (!songs.length) {
    box.replaceChildren(el("div", { className: "ui-empty", textContent: "받은 곡이 없어요. 받기에서 먼저 받아 주세요." }));
    return;
  }
  box.replaceChildren(...songs.map((s) => {
    const tile = el("span", { className: "ui-tile ui-s ui-accent" });
    tile.innerHTML = UI.icon("spark");
    const row = el("div", { className: "ui-row", role: "button", tabIndex: 0 }, tile,
      el("div", { className: "ui-txt" },
        el("span", { className: "ui-t song-name", textContent: s.name.replace(/\.[^.]+$/, "") }),
        el("span", { className: "ui-d", textContent: `${fmtSize(s.size)} · ${fmtDate(s.mtime)}` })));
    row.insertAdjacentHTML("beforeend", UI.icon("chev", "ui-chev"));
    row.dataset.uiDetail = s.name;
    if (s.name === ed.name) row.setAttribute("aria-current", "true");
    return row;
  }));
}

// 키트의 목록-상세: 행을 누르면 detail, 뒤로(또는 폰의 뒤로 가기)면 list
ld.addEventListener("ui:view", (e) => {
  if (e.detail.view === "detail" && e.detail.value) openEditor(e.detail.value);
  if (e.detail.view === "list") stopPreview();
});

function openSong(name) {
  if (location.hash !== "#songs") location.hash = "#songs";
  UI.setView("detail", ld, name);
}

async function openEditor(name) {
  if (ed.name === name) return;
  stopPreview();
  Object.assign(ed, { name, duration: 0, peaks: [], start: 0, end: 0 });
  $("#edEmpty").hidden = true;
  $("#editor").hidden = false;
  $("#edName").textContent = name;
  setMsg("");
  $("#waveMsg").textContent = "파형 읽는 중…"; $("#waveMsg").hidden = false;
  audio.src = `api/songs/${enc(name)}/audio`;
  syncInputs(); draw();
  ld.querySelectorAll("[data-ui-detail]").forEach((r) => {
    if (r.dataset.uiDetail === name) r.setAttribute("aria-current", "true"); else r.removeAttribute("aria-current");
  });
  try {
    const w = await api(`api/songs/${enc(name)}/peaks?n=1200`);
    if (ed.name !== name) return;
    Object.assign(ed, { duration: w.duration, peaks: w.peaks, start: 0, end: r2(w.duration) });
    $("#waveMsg").hidden = true;
  } catch (e) {
    if (ed.name === name) ed.name = null;  // 다시 누르면 다시 읽는다
    $("#waveMsg").textContent = e.message;
  }
  syncInputs(); draw();
}

function setMsg(text, kind = "") { const m = $("#edMsg"); m.textContent = text; m.className = "msg" + (kind ? " " + kind : ""); }

function syncInputs() {
  $("#edStart").value = ed.duration ? fmt(ed.start) : "";
  $("#edEnd").value = ed.duration ? fmt(ed.end) : "";
  $("#edLen").textContent = ed.duration ? `${fmt(ed.end - ed.start)} / ${fmt(ed.duration)}` : "–";
  $("#doCut").disabled = $("#preview").disabled = !ed.duration;
}

function color(name) { return getComputedStyle(canvas).getPropertyValue(name).trim(); }

function draw() {
  const dpr = window.devicePixelRatio || 1;
  const w = canvas.clientWidth, h = canvas.clientHeight;
  if (!w || !h) return;
  if (canvas.width !== Math.round(w * dpr) || canvas.height !== Math.round(h * dpr)) {
    canvas.width = Math.round(w * dpr); canvas.height = Math.round(h * dpr);
  }
  const g = canvas.getContext("2d");
  g.setTransform(dpr, 0, 0, dpr, 0, 0);
  g.clearRect(0, 0, w, h);
  if (!ed.duration) return;
  const X = (t) => (t / ed.duration) * w;
  const xs = X(ed.start), xe = X(ed.end);
  const on = color("--ui-accent"), off = color("--ui-t6");
  g.fillStyle = on; g.globalAlpha = 0.12;
  g.fillRect(xs, 0, xe - xs, h);
  g.globalAlpha = 1;
  const n = ed.peaks.length, mid = h / 2, bar = 2, gap = 1;
  for (let x = 0; x < w; x += bar + gap) {
    const i0 = Math.floor((x / w) * n), i1 = Math.max(i0 + 1, Math.floor(((x + bar + gap) / w) * n));
    let p = 0;
    for (let i = i0; i < i1 && i < n; i++) p = Math.max(p, ed.peaks[i]);
    const bh = Math.max(1, p * (h - 12));
    g.fillStyle = x + bar >= xs && x <= xe ? on : off;
    g.fillRect(x, mid - bh / 2, bar, bh);
  }
  g.fillStyle = on;
  for (const x of [xs, xe]) {
    g.fillRect(Math.round(x) - 1, 0, 2, h);
    g.fillRect(Math.round(x) - 5, 0, 10, 8);
    g.fillRect(Math.round(x) - 5, h - 8, 10, 8);
  }
  if (audio.getAttribute("src") && !isNaN(audio.currentTime)) {
    g.fillStyle = color("--ui-t1");
    g.fillRect(Math.round(X(audio.currentTime)), 0, 1, h);
  }
}
new ResizeObserver(() => draw()).observe(canvas);
document.addEventListener("ui:theme", () => requestAnimationFrame(draw));

function tick() {
  if (ed.previewing && audio.currentTime >= ed.end) { audio.pause(); audio.currentTime = ed.end; }
  draw();
  ed.raf = audio.paused ? 0 : requestAnimationFrame(tick);
}
audio.addEventListener("play", () => { cancelAnimationFrame(ed.raf); ed.raf = requestAnimationFrame(tick); });
audio.addEventListener("pause", () => {
  if (!audio.paused) return;  // 앞서 멈춘 것의 늦게 온 알림 — 그사이 구간 듣기가 다시 시작됐다
  ed.previewing = false; $("#preview").textContent = "구간 듣기"; draw();
});
audio.addEventListener("seeked", draw);

function stopPreview() { ed.previewing = false; if (!audio.paused) audio.pause(); }

$("#preview").onclick = () => {
  if (ed.previewing) return stopPreview();
  audio.currentTime = ed.start;
  ed.previewing = true;
  $("#preview").textContent = "멈추기";
  audio.play().catch(() => { ed.previewing = false; $("#preview").textContent = "구간 듣기"; });
};

function timeAt(e) {
  const r = canvas.getBoundingClientRect();
  return r2(Math.min(1, Math.max(0, (e.clientX - r.left) / r.width)) * ed.duration);
}
const MIN_LEN = 0.05;
canvas.addEventListener("pointerdown", (e) => {
  if (!ed.duration) return;
  canvas.setPointerCapture(e.pointerId);
  const r = canvas.getBoundingClientRect();
  const px = e.clientX - r.left, X = (t) => (t / ed.duration) * r.width;
  const near = e.pointerType === "touch" ? 24 : 12;
  const ds = Math.abs(px - X(ed.start)), de = Math.abs(px - X(ed.end));
  if (ds <= near && ds <= de) ed.drag = { mode: "start" };
  else if (de <= near) ed.drag = { mode: "end" };
  else ed.drag = { mode: "new", anchor: timeAt(e), x0: px, moved: false };
});
canvas.addEventListener("pointermove", (e) => {
  const d = ed.drag;
  if (!d) return;
  const t = timeAt(e);
  if (d.mode === "start") ed.start = Math.min(t, r2(ed.end - MIN_LEN));
  else if (d.mode === "end") ed.end = Math.max(t, r2(ed.start + MIN_LEN));
  else {
    if (Math.abs(e.clientX - canvas.getBoundingClientRect().left - d.x0) > 4) d.moved = true;
    if (!d.moved) return;
    ed.start = Math.min(d.anchor, t); ed.end = Math.max(d.anchor, t);
    if (ed.end - ed.start < MIN_LEN) ed.end = Math.min(ed.duration, r2(ed.start + MIN_LEN));
  }
  syncInputs(); draw();
});
function endDrag(e) {
  const d = ed.drag;
  ed.drag = null;
  if (d && d.mode === "new" && !d.moved && e.type === "pointerup") {
    ed.previewing = false;
    audio.currentTime = timeAt(e);
    audio.play().catch(() => {});
  }
}
canvas.addEventListener("pointerup", endDrag);
canvas.addEventListener("pointercancel", endDrag);

function setFromInput(which) {
  const input = which === "start" ? $("#edStart") : $("#edEnd");
  const t = parseTime(input.value);
  if (t == null || t > ed.duration) {
    setMsg(t == null ? `시간 꼴이 아니에요: ${input.value} (예: 1:23.5 또는 83.5)` : `곡 길이(${fmt(ed.duration)})보다 길어요`, "err");
    return syncInputs();
  }
  if (which === "start") { ed.start = r2(t); if (ed.end - ed.start < MIN_LEN) ed.end = Math.min(ed.duration, r2(ed.start + MIN_LEN)); }
  else { ed.end = r2(t); if (ed.end - ed.start < MIN_LEN) ed.start = Math.max(0, r2(ed.end - MIN_LEN)); }
  setMsg("");
  syncInputs(); draw();
}
for (const which of ["start", "end"]) {
  const input = which === "start" ? $("#edStart") : $("#edEnd");
  input.addEventListener("change", () => setFromInput(which));
  input.addEventListener("keydown", (e) => { if (e.key === "Enter") input.blur(); });
}
$("#setStart").onclick = () => {
  if (!ed.duration) return;
  ed.start = r2(audio.currentTime || 0);
  if (ed.end - ed.start < MIN_LEN) ed.end = r2(ed.duration);
  syncInputs(); draw();
};
$("#setEnd").onclick = () => {
  if (!ed.duration) return;
  ed.end = r2(audio.currentTime || 0);
  if (ed.end - ed.start < MIN_LEN) ed.start = 0;
  syncInputs(); draw();
};

$("#doCut").onclick = async () => {
  const btn = $("#doCut");
  btn.disabled = true;
  btn.classList.add("ui-loading");
  setMsg("자르는 중…");
  try {
    const c = await api("api/cuts", { method: "POST", body: JSON.stringify({
      song: ed.name, start: ed.start, end: ed.end,
      fade_in: parseFloat($("#fadeIn").value) || 0, fade_out: parseFloat($("#fadeOut").value) || 0,
    }) });
    lastCut = c.file;
    setMsg(`${fmt(c.duration)} 를 잘라 저장했어요. 잘라낸 곡에서 들을 수 있어요.`);
    UI.toast("잘라서 저장했어요");
  } catch (e) {
    setMsg(e.message, "err");
  } finally {
    btn.classList.remove("ui-loading");
    btn.disabled = !ed.duration;
  }
};

/* ---------- 잘라낸 곡 ---------- */
async function loadCuts() {
  let cuts;
  try { cuts = await api("api/cuts"); } catch { return; }
  const box = $("#cuts");
  if (!cuts.length) {
    box.replaceChildren(el("section", { className: "ui-card" },
      el("div", { className: "ui-empty", textContent: "아직 잘라낸 곡이 없어요. 받은 곡에서 잘라 보세요." })));
    return;
  }
  box.replaceChildren(...cuts.map((c) => {
    const fresh = c.name === lastCut;
    const dl = el("a", { href: `api/cuts/${enc(c.name)}/audio?download=1`, textContent: "다운로드", className: "ui-btn ui-weak ui-m" });
    dl.setAttribute("download", c.name);
    return el("article", { className: "ui-card ui-card-pad gap" },
      el("div", { className: "job-status" },
        fresh ? el("span", { className: "ui-badge ui-success", textContent: "방금" }) : null,
        el("span", { textContent: `${fmtSize(c.size)} · ${fmtDate(c.mtime)}` })),
      el("div", { className: "cut-title", textContent: c.name }),
      el("audio", { controls: true, preload: fresh ? "metadata" : "none", src: `api/cuts/${enc(c.name)}/audio` }),
      el("div", { className: "ui-btn-row" }, dl));
  }));
}

/* ---------- 시작 ---------- */
(async () => {
  outDir = load("ytmp3.outDir");
  try {
    const cfg = await api("api/config");
    defaultOut = cfg.out_dir;
    $("#cutsDir").textContent = cfg.cuts_dir;
    canReveal = cfg.can_reveal;
    if (!cfg.can_change_out) { outDir = null; $("#outEdit").hidden = true; }
    if (cfg.test_mode) {
      // 시험 모드: 어떤 재생이든 시작되는 순간 음소거 (play 는 버블링하지 않아 캡처로 받는다)
      $("#testmode").hidden = false;
      const mute = (a) => { a.muted = true; a.volume = 0; };
      document.querySelectorAll("audio").forEach(mute);
      document.addEventListener("play", (e) => mute(e.target), true);
      document.addEventListener("volumechange", (e) => { if (!e.target.muted) mute(e.target); }, true);
    }
  } catch {}
  showFolder();
  route();
  try { if (await refresh()) poll(); } catch { render(); loadSongs(); }
})();
</script>
</body>
