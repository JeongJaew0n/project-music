[project]
name = "project-music"
version = "0.6.0"
requires-python = ">=3.12"
dependencies = [
    "yt-dlp[default]",
]

[dependency-groups]
dev = [
    "pytest",
]

[project.scripts]
ytmp3 = "ytmp3.__main__:main"
ytmp3-web = "ytmp3.web:main"
songcut = "songcut.__main__:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["ytmp3", "songcut", "shared"]

[tool.pytest.ini_options]
markers = [
    "network: 실제 유튜브에 접속하는 시험 (YTMP3_NETWORK=1 일 때만 실행)",
    "screen: 헤드리스 Chrome 으로 화면을 재는 시험 (Chrome·node 없으면 건너뜀)",
]
